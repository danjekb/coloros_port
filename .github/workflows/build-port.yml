name: Build ColorOS Port (RMX3371)

on:
  workflow_dispatch:
    inputs:
      base_rom_url:
        description: 'Base ROM URL (official OTA for target device)'
        required: true
        type: string
      port_rom_url:
        description: 'Port ROM URL (official OTA for donor device, must contain payload.bin)'
        required: true
        type: string
      device_codename:
        description: 'Target device codename (artifact label)'
        required: false
        type: string
        default: 'RMX3371'
      pack_method:
        description: 'Output: fastboot package (recommended) or stock OTA'
        required: false
        type: choice
        options:
          - fastboot
          - stock
        default: 'fastboot'
      clean_disk:
        description: 'Free disk at verified safe points during the build'
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build ColorOS Port for ${{ inputs.device_codename }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read

    steps:
      # Same disk-expansion strategy as the working BrinaOS workflow.
      - name: Free runner disk space
        if: ${{ inputs.clean_disk }}
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout porting scripts
        uses: actions/checkout@v4
        with:
          ref: COS15/OOS15

      - name: Show runner resources
        run: |
          df -h /
          nproc
          free -h

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            aria2 python3 busybox zip unzip p7zip-full \
            openjdk-21-jre-headless zstd bc xmlstarlet \
            android-sdk-libsparse-utils binutils erofs-utils
          echo "=== Required commands ==="
          for tool in aria2c 7z zip unzip java python3 zstd bc xmlstarlet; do
            command -v "$tool"
          done
          echo "=== Repo tools ==="
          for tool in payload-dumper lpmake mkfs.erofs; do
            command -v "$tool" || find bin otatools -type f -name "$tool" -print -quit
          done

      - name: Prepare scripts and configure pack method
        env:
          PACK_METHOD: ${{ inputs.pack_method }}
        run: |
          set -Eeuo pipefail
          chmod +x port.sh setup.sh functions.sh
          chmod +x bin/Linux/x86_64/* 2>/dev/null || true
          chmod +x otatools/bin/* 2>/dev/null || true
          sed -i "s/^pack_method=.*/pack_method=${PACK_METHOD}/" bin/port_config
          grep -n '^pack_method=' bin/port_config
          echo "$(pwd)/bin/Linux/x86_64" >> "$GITHUB_PATH"
          echo "$(pwd)/otatools/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/bin" >> "$GITHUB_PATH"

      - name: Patch port.sh with guarded disk cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          path = Path("port.sh")
          src = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global src
              count = src.count(old)
              if count != 1:
                  sys.exit(f"Refusing unsafe patch: {label} anchor count={count}, expected 1")
              src = src.replace(old, new, 1)

          # Base OTA: only remove the archive after the base payload/images have
          # actually been extracted. Keep extracted base images and trees.
          replace_once(
              "payload-dumper --out build/baserom/images/ $baserom",
              '''if ! payload-dumper --out build/baserom/images/ "$baserom"; then
                  echo "Base payload extraction failed; keeping the OTA archive."
                  exit 1
              fi''',
              "base payload extraction",
          )

          replace_once(
              'fi\nblue "正在提取移植包 [payload.bin]" "Extracting files from PORTROM [payload.bin]"',
              '''fi
          if [[ "${CI_FREE_SPACE:-false}" == "true" ]]; then
              for required_part in system product system_ext my_product my_manifest; do
                  if [[ ! -s "build/baserom/images/${required_part}.img" ]]; then
                      echo "Missing extracted base partition ${required_part}.img; keeping the base OTA archive."
                      exit 1
                  fi
              done
              echo "CI_FREE_SPACE: required base partitions verified; removing base OTA archive."
              rm -f -- "$baserom"
              df -h .
          fi
          blue "正在提取移植包 [payload.bin]" "Extracting files from PORTROM [payload.bin]"''',
              "base archive cleanup point",
          )

          # Donor OTA: verify payload-dumper completed and produced images before
          # deleting the donor archive.
          replace_once(
              "\tpayload-dumper --partitions ${port_partition} --out build/portrom/images/ $portrom",
              '''if ! payload-dumper --partitions "${port_partition}" --out build/portrom/images/ "$portrom"; then
              echo "Port payload extraction failed; keeping the donor OTA archive."
              exit 1
          fi
          if [[ "${CI_FREE_SPACE:-false}" == "true" ]]; then
              if ! find build/portrom/images -type f -name "*.img" -size +0c -print -quit | grep -q .; then
                  echo "No extracted donor images found; keeping the donor OTA archive."
                  exit 1
              fi
              echo "CI_FREE_SPACE: donor extraction verified; removing donor OTA archive."
              rm -f -- "$portrom"
              df -h .
          fi''',
              "donor payload extraction",
          )

          # Base extracted partition trees are used for ROM adaptation through
          # the AONService block. Remove only those trees after that final use;
          # retain the original base .img files for firmware/vbmeta packaging.
          replace_once(
              "\nfi\n\n#自定义替换\n",
              '''
          fi

          if [[ "${CI_FREE_SPACE:-false}" == "true" ]]; then
              echo "CI_FREE_SPACE: removing base partition trees after their final source use."
              find build/baserom/images -mindepth 1 -maxdepth 1 -type d -exec rm -rf -- {} +
              df -h .
          fi

          #自定义替换
          ''',
              "base partition tree cleanup",
          )

          # After every donor partition has been packed, preserve a root-level
          # build.prop for the later stock-OTA metadata-copy step, then remove
          # the now-unused extracted directory contents. Keep all .img files.
          replace_once(
              'rm fstype.txt\nrom_version=$(cat build/portrom/images/my_manifest/build.prop | grep "ro.build.display.id=" |  awk \'NR==1\' | cut -d "=" -f2 | cut -d "(" -f1)\nfor img in $(find build/baserom/ -type f -name "vbmeta*.img");do',
              '''rm fstype.txt
          rom_version=$(cat build/portrom/images/my_manifest/build.prop | grep "ro.build.display.id=" |  awk 'NR==1' | cut -d "=" -f2 | cut -d "(" -f1)

          if [[ "${CI_FREE_SPACE:-false}" == "true" ]]; then
              echo "CI_FREE_SPACE: pruning donor partition trees after image packing."
              for ci_tree in build/portrom/images/*; do
                  [[ -d "$ci_tree" ]] || continue
                  [[ "$(basename "$ci_tree")" == "config" ]] && continue
                  ci_prop=$(find "$ci_tree" -type f -name build.prop \
                      -not -path "*/system_dlkm/*" -not -path "*/odm_dlkm/*" -print -quit)
                  if [[ -n "$ci_prop" && "$ci_prop" != "$ci_tree/build.prop" ]]; then
                      cp -f -- "$ci_prop" "$ci_tree/build.prop"
                  fi
                  find "$ci_tree" -mindepth 1 -maxdepth 1 ! -name build.prop -exec rm -rf -- {} +
              done
              rm -rf -- build/portrom/images/config
              df -h .
          fi

          for img in $(find build/baserom/ -type f -name "vbmeta*.img");do''',
              "donor partition tree cleanup",
          )

          # The individual partition .img files and super.img are no longer
          # needed once a non-empty super.zst has been created successfully.
          replace_once(
              'zstd build/portrom/images/super.img -o build/portrom/super.zst',
              '''zstd build/portrom/images/super.img -o build/portrom/super.zst
          if [[ "${CI_FREE_SPACE:-false}" == "true" ]]; then
              if [[ ! -s build/portrom/super.zst ]]; then
                  echo "super.zst was not created; retaining source images."
                  exit 1
              fi
              echo "CI_FREE_SPACE: super.zst verified; removing source super and partition images."
              rm -f -- build/portrom/images/super.img
              for pname in ${super_list}; do
                  rm -f -- "build/portrom/images/${pname}.img"
              done
              df -h .
          fi''',
              "super.zst cleanup point",
          )

          # super.zst is already compressed; store it without a second deflate pass.
          replace_once(
              "zip -r ${os_type}_${rom_version}.zip ./*",
              "zip -0 -r ${os_type}_${rom_version}.zip ./*",
              "fastboot package zip",
          )

          path.write_text(src, encoding="utf-8")
          subprocess.run(["bash", "-n", str(path)], check=True)
          print("Patched port.sh; all cleanup anchors matched exactly once and bash -n passed.")
          PY

      - name: Build ROM
        env:
          CI_FREE_SPACE: ${{ inputs.clean_disk }}
          BASE_ROM_URL: ${{ inputs.base_rom_url }}
          PORT_ROM_URL: ${{ inputs.port_rom_url }}
          DEVICE_CODENAME: ${{ inputs.device_codename }}
          PACK_METHOD: ${{ inputs.pack_method }}
        run: |
          set -Eeuo pipefail
          echo "Target: ${DEVICE_CODENAME}"
          echo "Pack method: ${PACK_METHOD}"
          echo "Disk cleanup: ${CI_FREE_SPACE}"
          df -h /
          start=$(date +%s)
          ./port.sh "$BASE_ROM_URL" "$PORT_ROM_URL" 2>&1 | tee port.log
          end=$(date +%s)
          echo "Build duration: $(( (end - start) / 60 ))m $(( (end - start) % 60 ))s"

      - name: Locate output package
        id: find-output
        if: always()
        env:
          PACK_METHOD: ${{ inputs.pack_method }}
        run: |
          set -Eeuo pipefail
          ZIP=""
          if [[ "$PACK_METHOD" == "stock" ]]; then
            ZIP=$(find out -maxdepth 1 -type f -name 'ota_full-*.zip' -print -quit 2>/dev/null || true)
          else
            ZIP=$(find out -maxdepth 1 -type f -name '*.zip' ! -name 'ota_full-*.zip' -print -quit 2>/dev/null || true)
          fi
          if [[ -n "$ZIP" && -s "$ZIP" ]]; then
            echo "Found package: $ZIP"
            ls -lh "$ZIP"
            echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"
          else
            echo "No output ZIP found."
            find out -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null | head -50 || true
            echo "zip_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload ROM artifact
        if: success() && steps.find-output.outputs.zip_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: coloros-${{ inputs.device_codename }}-${{ github.run_number }}
          path: ${{ steps.find-output.outputs.zip_path }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coloros-build-log-${{ github.run_number }}
          path: port.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Final disk report
        if: always()
        run: |
          df -h /
          df -h . || true
          
